              type: boolean
            worksEnabled:
              type: boolean
              description: Whether the office chose to show its public Works tab.
            certifications:
              type: array
              items:
                type: string
            certificationsAr:
              type: array
              items:
                type: string
            services:
              type: array
              items:
                $ref: "#/components/schemas/OfficeService"
            gallery:
              type: array
              items:
                $ref: "#/components/schemas/OfficeMedia"
            works:
              description: Approved Works portfolio images only.
              type: array
              items:
                $ref: "#/components/schemas/OfficeMedia"
            pendingWorksItems:
              description: Works images awaiting review; authenticated owner/admin views only.
              type: array
              items:
                $ref: "#/components/schemas/OfficeMedia"
            primaryMediaId:
              type: ["integer", "null"]
              description: id of the gallery item to display first, if any.
            pendingChanges:
              type: ["object", "null"]
              additionalProperties: true
              description: |
                Staged edits awaiting admin approval, only present while the
                office is approved/active/suspended (edit-lock revision
                flow). Never merged into the fields above until approved.
            pendingChangesSubmittedAt:
              type: ["string", "null"]
              format: date-time
            isSubscriptionHidden:
              type: boolean
              description: |
                True when the office is hidden due to non-payment or because the
                market is at capacity and the office is on the waitlist.
                Only present in authenticated provider/admin views.
            slotStatus:
              type: ["string", "null"]
              description: |
                Current market slot status from market_slot_allocations.
                Values: allocated | reserved | waiting | released | not_required.
                Null if no slot record exists yet.
            reservationExpiresAt:
              type: ["string", "null"]
              format: date-time
              description: |
                ISO-8601 timestamp when the 3-hour exclusive slot reservation expires.
                Present only when slotStatus = 'reserved'. Null otherwise.
            latitude:
              type: ["number", "null"]
              description: Precise latitude for the authenticated provider/admin view.
            longitude:
              type: ["number", "null"]
              description: Precise longitude for the authenticated provider/admin view.

