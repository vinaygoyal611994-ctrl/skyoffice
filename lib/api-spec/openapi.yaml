openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: SkayOffice Pilot API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Registration, login, session
  - name: Categories
    description: Service categories
  - name: Offices
    description: Office discovery and profile management
  - name: Favourites
    description: Customer saved offices
  - name: Platform
    description: Platform-wide stats
  - name: Admin
    description: Admin dashboard operations
  - name: Contact
    description: Login-gated, verified contact events and video-call requests
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ------------------------------------------------------------------
  # Auth
  # ------------------------------------------------------------------
  /auth/register/customer:
    post:
      operationId: registerCustomer
      tags: [Auth]
      summary: Register a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRegisterInput"
      responses:
        "201":
          description: Customer registered and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/register/office:
    post:
      operationId: registerOffice
      tags: [Auth]
      summary: Register a new office account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeRegisterInput"
      responses:
        "201":
          description: Office registered and session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ------------------------------------------------------------------
  # Categories
  # ------------------------------------------------------------------
  /categories:
    get:
      operationId: listCategories
      tags: [Categories]
      summary: List service categories with office counts
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategorySummary"

  # ------------------------------------------------------------------
  # Offices (public discovery)
  # ------------------------------------------------------------------
  /offices:
    get:
      operationId: listOffices
      tags: [Offices]
      summary: Discover offices
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OfficeCategory"
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: verifiedOnly
          in: query
          required: false
          schema:
            type: boolean
        - name: providerType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ProviderType"
        - name: sort
          in: query
          schema:
            type: string
            enum: [nearest, available, newest]
            default: newest
        - name: latitude
          in: query
          schema:
            type: number
        - name: longitude
          in: query
          schema:
            type: number
        - name: city
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of offices matching the filters
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, limit]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OfficeSummary"
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
  /offices/{officeId}:
    get:
      operationId: getOffice
      tags: [Offices]
      summary: Get an office's full digital profile
      parameters:
        - name: officeId
          in: path
          required: true
          description: Either the numeric office id or its public slug.
          schema:
            type: string
      responses:
        "200":
          description: Office profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOfficeProfile"
        "404":
          description: Office not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ------------------------------------------------------------------
  # Offices (self-management, office role)
  # ------------------------------------------------------------------
  /offices/me:
    get:
      operationId: getMyOffice
      tags: [Offices]
      summary: Get the logged-in office's own profile
      responses:
        "200":
          description: Office profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateMyOffice
      tags: [Offices]
      summary: Update the logged-in office's own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeUpdate"
      responses:
        "200":
          description: Updated office profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /offices/me/works-visibility:
    patch:
      operationId: updateMyOfficeWorksVisibility
      tags: [Offices]
      summary: Enable or disable the logged-in office's public Works tab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorksVisibilityUpdate"
      responses:
        "200":
          description: Updated office profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /offices/me/services:
    post:
      operationId: addMyOfficeService
      tags: [Offices]
      summary: Add a service offered by the logged-in office
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeServiceInput"
      responses:
        "201":
          description: Service added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeService"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /offices/me/services/{serviceId}:
    delete:
      operationId: removeMyOfficeService
      tags: [Offices]
      summary: Remove a service from the logged-in office
      parameters:
        - name: serviceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Service removed
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /offices/me/media:
    post:
      operationId: addMyOfficeMedia
      tags: [Offices]
      summary: Add a Decision Card gallery or Works media item to the logged-in office
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeMediaInput"
      responses:
        "201":
          description: Media added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeMedia"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /offices/me/media/{mediaId}:
    delete:
      operationId: removeMyOfficeMedia
      tags: [Offices]
      summary: Remove a gallery media item from the logged-in office
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Media removed
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Media not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /offices/me/documents:
    get:
      operationId: listMyOfficeDocuments
      tags: [Offices]
      summary: List the logged-in office's verification documents
      responses:
        "200":
          description: Verification documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerificationDocument"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: addMyOfficeDocument
      tags: [Offices]
      summary: Upload a verification document for the logged-in office
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationDocumentInput"
      responses:
        "201":
          description: Document added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDocument"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /offices/me/documents/{documentId}:
    delete:
      operationId: removeMyOfficeDocument
      tags: [Offices]
      summary: Remove a verification document from the logged-in office
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Document removed
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /offices/me/submit:
    post:
      operationId: submitMyOfficeApplication
      tags: [Offices]
      summary: Submit the logged-in office's application for admin review
      description: |
        Transitions the office from draft/changes_requested into the review
        queue. Fails with 400 if required fields or documents are missing.
      responses:
        "200":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeProfile"
        "400":
          description: Application incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionValidationError"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /offices/me/marketing-video:
    put:
      operationId: setMyOfficeMarketingVideo
      tags: [Offices]
      summary: Register/replace the logged-in office's single marketing video
      description: |
        Registers a previously-uploaded MP4 (category `marketing_video`) as
        the office's one optional marketing video, shown on its Digital
        Office / Decision Card with the cover image as poster. Replacing an
        existing video overwrites it; the previous file is cleaned up
        best-effort. Not subject to the approved/active/suspended edit
        lock — it takes effect immediately, same as gallery media. The server
        independently validates the actual MP4 file and its duration; client
        metadata is advisory only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingVideoInput"
      responses:
        "200":
          description: Updated office profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeProfile"
        "400":
          description: Invalid file (wrong type, too large, too long) or not yet readable in storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: removeMyOfficeMarketingVideo
      tags: [Offices]
      summary: Remove the logged-in office's marketing video
      responses:
        "200":
          description: Updated office profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: No marketing video to remove
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /offices/me/media/{mediaId}/primary:
    patch:
      operationId: setMyOfficePrimaryMedia
      tags: [Offices]
      summary: Mark a gallery item as the office's primary media
      parameters:
        - name: mediaId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated office profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Media not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ------------------------------------------------------------------
  # Favourites (customer role)
  # ------------------------------------------------------------------
  /favourites:
    get:
      operationId: listFavourites
      tags: [Favourites]
      summary: List the logged-in customer's saved offices
      responses:
        "200":
          description: Saved offices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfficeSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: addFavourite
      tags: [Favourites]
      summary: Save an office to favourites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavouriteInput"
      responses:
        "201":
          description: Favourite added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favourite"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /favourites/{officeId}:
    delete:
      operationId: removeFavourite
      tags: [Favourites]
      summary: Remove an office from favourites
      parameters:
        - name: officeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Favourite removed
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ------------------------------------------------------------------
  # Contact (customer role) — verified contact events & video-call requests
  # ------------------------------------------------------------------
  /contact-events:
    post:
      operationId: createContactEvent
      tags: [Contact]
      summary: Record a verified contact event (WhatsApp click, location click, share click)
      description: |
        Requires an authenticated, active (non-suspended) customer session.
        Rapid repeat taps of the same action on the same office are
        deduplicated server-side and return the existing recent event
        instead of creating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEventInput"
      responses:
        "201":
          description: Contact event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEvent"
        "200":
          description: Deduplicated — an identical event was just created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactEvent"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not an active customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Office not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /video-call-requests:
    post:
      operationId: createVideoCallRequest
      tags: [Contact]
      summary: Submit a real video-call request to an office
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoCallRequestInput"
      responses:
        "201":
          description: Video-call request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoCallRequest"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not an active customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Office not found or video calls not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /video-call-requests/me:
    get:
      operationId: listMyVideoCallRequests
      tags: [Contact]
      summary: List the logged-in customer's own video-call requests
      responses:
        "200":
          description: Video-call requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoCallRequest"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /contact-events/me:
    get:
      operationId: listMyContactEvents
      tags: [Contact]
      summary: List the logged-in customer's own recent verified contact events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Contact events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyContactEventSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /offices/me/contact-events:
    get:
      operationId: listMyOfficeContactEvents
      tags: [Contact]
      summary: List recent verified contact events for the logged-in office's own office
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Contact events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfficeContactEventSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not an office
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /offices/me/video-call-requests:
    get:
      operationId: listMyOfficeVideoCallRequests
      tags: [Contact]
      summary: List video-call requests for the logged-in office's own office
      responses:
        "200":
          description: Video-call requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfficeVideoCallRequestSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not an office
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /offices/me/video-call-requests/{requestId}/status:
    patch:
      operationId: updateMyOfficeVideoCallRequestStatus
      tags: [Contact]
      summary: Update the status of one of the office's own video-call requests
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVideoCallRequestStatusBody"
      responses:
        "200":
          description: Updated video-call request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeVideoCallRequestSummary"
        "400":
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not the owning office
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ------------------------------------------------------------------
  # Platform-wide stats
  # ------------------------------------------------------------------
  /platform/summary:
    get:
      operationId: getPlatformSummary
      tags: [Platform]
      summary: Platform-wide trust stats for the homepage
      responses:
        "200":
          description: Platform summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSummary"

  # ------------------------------------------------------------------
  # Admin
  # ------------------------------------------------------------------
  /admin/offices:
    get:
      operationId: listAdminOffices
      tags: [Admin]
      summary: List all offices, including unverified and demo offices
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OfficeCategory"
        - name: isVerified
          in: query
          required: false
          schema:
            type: boolean
        - name: isDemo
          in: query
          required: false
          schema:
            type: boolean
        - name: providerType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProviderType"
      responses:
        "200":
          description: Offices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOfficeSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /admin/offices/{officeId}/verification:
    patch:
      operationId: setOfficeVerification
      tags: [Admin]
