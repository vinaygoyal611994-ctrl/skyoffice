  # ------------------------------------------------------------------
  # Storage
  # ------------------------------------------------------------------
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: |
            Optional machine-readable error code for clients that want to
            branch on the failure reason instead of parsing the message
            (e.g. "file_not_readable" when an uploaded object could not be
            confirmed as readable in storage).

    UserRole:
      type: string
      enum: [office, customer, admin]

    OfficeCategory:
      type: string
      enum:
        - translation
        - legal
        - marketing
        - development
        - design
        - real_estate
        - company_formation
        - business_consulting
        - accounting
        - social_media_management
        - other

    SelectableOfficeCategory:
      description: Current category choices accepted for new registrations and profile edits. Legacy `other` records remain readable through OfficeCategory.
      type: string
      enum:
        - translation
        - legal
        - marketing
        - development
        - design
        - real_estate
        - company_formation
        - business_consulting
        - accounting
        - social_media_management

    ProviderType:
      type: string
      enum:
        - office
        - freelancer

    OfficeStatus:
      type: string
      enum:
        - draft
        - under_review
        - changes_requested
        - approved
        - active
        - rejected
        - suspended

    VerificationDocumentType:
      type: string
      enum:
        - identity
        - trade_license
        - professional_license
        - certificate

    VerificationDocumentStatus:
      type: string
