            phone:
              type: ["string", "null"]
            whatsapp:
              type: ["string", "null"]
            acceptsPhoneCalls:
              type: boolean
              description: Whether the WhatsApp number above also accepts regular phone calls.
            spokenLanguages:
              type: array
              items:
                type: string
              description: Stable language codes from the default 6-language list.
            customLanguages:
              type: array
              items:
                type: string
              description: Free-text "Other" language entries the office typed in themselves.
            email:
              type: string
            website:
              type: ["string", "null"]
            address:
              type: ["string", "null"]
            country:
              type: ["string", "null"]
            specialization:
              type: ["string", "null"]
            googleMapsUrl:
              type: ["string", "null"]
            submittedAt:
              type: ["string", "null"]
              format: date-time
            reviewedAt:
              type: ["string", "null"]
              format: date-time
            activatedAt:
              type: ["string", "null"]
              format: date-time
            heroMediaUrl:
              type: ["string", "null"]
            heroMediaType:
              $ref: "#/components/schemas/MediaType"
