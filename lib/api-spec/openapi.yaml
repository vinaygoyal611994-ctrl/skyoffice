            marketingVideoUpdatedAt:
              type: ["string", "null"]
              format: date-time
            videoCallEnabled:
              type: boolean
            worksEnabled:
              type: boolean
              description: Whether the office chose to show its public Works tab.
            certifications:
              type: array
              items:
