            googleMapsUrl:
              type: ["string", "null"]
            rejectionReason:
              type: ["string", "null"]
            changeRequestReason:
              type: ["string", "null"]
            submittedAt:
              type: ["string", "null"]
              format: date-time
            reviewedAt:
              type: ["string", "null"]
              format: date-time
            activatedAt:
              type: ["string", "null"]
              format: date-time
            heroMediaUrl:
              type: ["string", "null"]
            heroMediaType:
              anyOf:
                - $ref: "#/components/schemas/MediaType"
                - type: "null"
